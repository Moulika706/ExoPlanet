# ExoVet global configuration.
# One fixed seed governs every stochastic step (splits, models, calibration).
seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  raw_csv: data/raw/koi_cumulative.csv
  processed_csv: data/processed/koi_clean.csv
  retrieval_record: data/raw/retrieval.json

splits:
  group_column: kepid
  n_folds: 5
  test_size: 0.2
  shuffle: true

features:
  target: koi_disposition
  group: kepid
  label_order:
    - CONFIRMED
    - CANDIDATE
    - FALSE POSITIVE
  core:
    - koi_period
    - koi_duration
    - koi_depth
    - koi_prad
    - koi_teq
    - koi_impact
    - koi_insol
    - koi_steff
    - koi_slogg
    - koi_srad
    - koi_kepmag
  leakage:
    - koi_score
    - koi_pdisposition
    - koi_fpflag_nt
    - koi_fpflag_ss
    - koi_fpflag_co
    - koi_fpflag_ec

models:
  logistic_regression:
    max_iter: 2000
  random_forest:
    n_estimators: 400
    max_depth: null
    min_samples_leaf: 2
  xgboost:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.8
    reg_lambda: 1.0

calibration:
  method: isotonic   # isotonic | platt

conformal:
  alpha: 0.10
  score: maxp        # 1 - max predicted probability

report:
  top_k: 5
  random_seed: 42
