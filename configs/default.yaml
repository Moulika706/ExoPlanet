# ExoVet global configuration.
# One fixed seed governs every stochastic step (splits, models, calibration).
seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  raw_csv: data/raw/koi_cumulative.csv
  processed_csv: data/processed/koi_clean.csv
  retrieval_record: data/raw/retrieval.json

splits:
  group_column: kepid
  n_folds: 5
  test_size: 0.2
  shuffle: true

eval:
  # Three-way grouped split over the folds of splits.n_folds:
  # fold `test_fold` -> test, fold `calibration_fold` -> calibration, rest -> train.
  test_fold: 0
  calibration_fold: 1
  ece_bins: 10
  recall_at_precision: 0.99
  pr_auc_average: macro

features:
  target: koi_disposition
  group: kepid
  label_order:
    - CONFIRMED
    - CANDIDATE
    - FALSE POSITIVE
  core:
    - koi_period
    - koi_duration
    - koi_depth
    - koi_prad
    - koi_teq
    - koi_impact
    - koi_insol
    - koi_steff
    - koi_slogg
    - koi_srad
    - koi_kepmag
  leakage:
    - koi_score
    - koi_pdisposition
    - koi_fpflag_nt
    - koi_fpflag_ss
    - koi_fpflag_co
    - koi_fpflag_ec

models:
  logistic_regression:
    max_iter: 2000
  random_forest:
    n_estimators: 400
    max_depth: null
    min_samples_leaf: 2
  xgboost:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.8
    reg_lambda: 1.0

calibration:
  method: isotonic   # isotonic | platt

conformal:
  alpha: 0.10
  score: maxp        # maxp | aps
  mode: marginal     # marginal | mondrian
  target_coverage: 0.90
  # Always put the model's best guess in the set, so a set is never empty.
  always_include_argmax: true

report:
  top_k: 5
  random_seed: 42

shap:
  # tree_path: classic Lundberg attribution, fast.
  # interventional: attributes against the background distribution, stricter.
  perturbation: tree_path
  background_size: 100
  # Rows sampled for the global importance table.
  global_max_rows: 2000

# Cross-fold stability of the SHAP ranking (Phase 2).
stability:
  model: xgboost
  # Rows sampled per fold for the SHAP computation.
  max_rows: 1500

# Cross-mission transfer, Kepler to TESS (Phase 5).
cross_mission:
  toi:
    raw_csv: data/raw/toi.csv
    retrieval_record: data/raw/retrieval_toi.json
    # TFOP working group disposition, mapped onto the canonical labels.
    disposition_column: tfopwg_disp
    # The host star of a TESS object (TESS Input Catalog id).
    group_column: tid
  # The core Kepler features that exist in both missions with the same
  # definition and the same unit. koi_impact has no TOI counterpart and
  # koi_kepmag would have to be replaced by a TESS magnitude, which is a
  # different photometric system, so both are left out.
  shared_features:
    - koi_period
    - koi_duration
    - koi_depth
    - koi_prad
    - koi_teq
    - koi_insol
    - koi_steff
    - koi_slogg
    - koi_srad
  # TFOPWG disposition to canonical label.
  label_map:
    PC: CANDIDATE
    APC: CANDIDATE
    CP: CONFIRMED
    KP: CONFIRMED
    FP: FALSE POSITIVE
    FA: FALSE POSITIVE
  # Fraction of the TESS objects held out for the recalibration fit.
  calibration_fraction: 0.5
