[project]
name = "exovet"
version = "0.1.0"
requires-python = "==3.11.*"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008", "B018", "BLE001"]

